<svg xmlns="http://www.w3.org/2000/svg" width="900" height="58" viewBox="0 0 900 58" role="img" aria-label="C:\&gt; RUN STATS.EXE">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".33"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#33ff66" stop-opacity=".09"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="t"><rect x="92" y="0" width="0" height="58">
      <animate attributeName="width" begin="0.4s" dur="0.91s" fill="freeze" calcMode="discrete" values="0.0;15.6;31.2;46.8;62.4;78.0;93.6;109.2;124.8;140.4;156.0;171.6;187.2;202.8;218.4"/>
    </rect></clipPath>
  </defs>
  <style>
    text { font-family:'VT323','Courier New',Courier,'Liberation Mono',monospace; fill:#33ff66; }
    .dim { fill:#1fa344; } .amber { fill:#ffb000; } .white { fill:#d9ffe2; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
    .ants { stroke-dasharray: 6 6; animation: march 1s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .scanbar { animation: run 4s ease-in-out infinite; }
    @keyframes run { 0% { transform:translateX(-140px) } 60%,100% { transform:translateX(900px) } }
  </style>
  <g filter="url(#glow)">
    <text x="4" y="36" font-size="26" class="amber">C:\&gt;</text>
    <g clip-path="url(#t)"><text x="92" y="36" font-size="26" style="font-weight:bold">RUN STATS.EXE</text></g>
    <rect x="92" y="16" width="14" height="24" fill="#33ff66" class="blink">
      <animate attributeName="x" begin="0.4s" dur="0.91s" fill="freeze" calcMode="discrete" values="92.0;107.6;123.2;138.8;154.4;170.0;185.6;201.2;216.8;232.4;248.0;263.6;279.2;294.8"/>
    </rect>
    <text x="896" y="34" font-size="18" text-anchor="end" class="dim">[ 04/07 ]</text>
  </g>
  <line class="ants" x1="0" y1="52" x2="900" y2="52" stroke="#1fa344" stroke-width="2"/>
  <rect class="scanbar" x="0" y="50" width="140" height="5" fill="#33ff66" opacity=".8"/>
</svg>
