<svg xmlns="http://www.w3.org/2000/svg" width="152" height="50" viewBox="0 0 152 50" role="img" aria-label="F4 STATS">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".33"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#33ff66" stop-opacity=".09"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#33ff66" stop-opacity=".28"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="148" height="46"/></clipPath>
  </defs>
  <style>
    text { font-family:'VT323','Courier New',Courier,'Liberation Mono',monospace; fill:#33ff66; }
    .dim { fill:#1fa344; } .amber { fill:#ffb000; } .white { fill:#d9ffe2; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
    .frame { animation: pulse 2.4s ease-in-out 1.0499999999999998s infinite; }
    @keyframes pulse { 0%,100% { stroke:#1fa344; } 50% { stroke:#33ff66; } }
    .shine { animation: shine 3.5s ease-in-out 1.0499999999999998s infinite; }
    @keyframes shine { 0% { transform:translateX(-120px) } 45%,100% { transform:translateX(192px) } }
    .arrow { animation: nudge 1.2s ease-in-out 1.0499999999999998s infinite; }
    @keyframes nudge { 0%,100% { transform:translateX(0) } 50% { transform:translateX(4px) } }
  </style>
  <rect x="1" y="1" width="150" height="48" fill="#0a0f0a"/>
  <rect class="frame" x="2" y="2" width="148" height="46" fill="none" stroke-width="2"/>
  <rect x="5" y="44" width="142" height="2" fill="#1fa344" opacity=".5"/>
  <g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="80" height="50" fill="url(#shine)"/></g>
  <rect x="12" y="12" width="36" height="26" fill="#ffb000"/>
  <text x="30" y="32" font-size="18" text-anchor="middle" style="fill:#0a0f0a;font-weight:bold">F4</text>
  <g filter="url(#glow)">
    <text x="56" y="32" font-size="18" style="font-weight:bold">STATS</text>
    <text class="arrow amber" x="132" y="32" font-size="15">▶</text>
  </g>
</svg>
